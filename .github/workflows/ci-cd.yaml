name: CI/CD - people-directory

on:
  push:
    branches: [main]

env:
  IMAGE: rayyan0426/people-directory
  NAMESPACE: default

jobs:
  build-and-deploy:
    runs-on: self-hosted   # <-- must be the runner on your minikube VM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps & run tests
        run: |
          pip install -r requirements.txt --break-system-packages
          pytest -q

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t $IMAGE:${{ steps.vars.outputs.sha_short }} -t $IMAGE:latest .

      - name: Push image
        run: |
          docker push $IMAGE:${{ steps.vars.outputs.sha_short }}
          docker push $IMAGE:latest

      - name: Deploy to minikube
        run: |
          kubectl apply -f k8s/flask-deployment.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/postgres-secret.yaml
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f k8s/flask-service.yaml
          kubectl apply -f k8s/servicemonitor.yaml

          kubectl set image deployment/flask-deployment \
            flask=$IMAGE:${{ steps.vars.outputs.sha_short }} \
            -n $NAMESPACE
          kubectl rollout status deployment/flask-deployment -n $NAMESPACE --timeout=120s

      - name: Smoke test
        run: |
          URL=$(minikube service flask-service --url -n $NAMESPACE)
          curl -f "$URL/health" || (echo "smoke test failed" && exit 1)

      - name: Apply Grafana alert rules
        run: |
          kubectl apply -f monitoring/alert-rules.yaml -n monitoring
