name: CI/CD - build, push to ECR, deploy to EKS

on:
  push:
    branches: [main]
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  EKS_CLUSTER: directory-cluster-tf          # CHANGED: new Terraform-built cluster
  ECR_REPOSITORY: personal/people-direcory
  APP_DIR: .
  CHART_PATH: people-directory
  VALUES_FILE: people-directory/values.yaml
  RELEASE_NAME: people-directory
  NAMESPACE: people-directory

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.push.outputs.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint "$CHART_PATH" -f "$VALUES_FILE" --set-string postgres.dbPassword=ci-validation-only

      - name: Helm template
        run: helm template "$RELEASE_NAME" "$CHART_PATH" -f "$VALUES_FILE" --set-string postgres.dbPassword=ci-validation-only > /dev/null

      - name: Build image
        run: docker build -t "$ECR_REPOSITORY:${GITHUB_SHA}" "$APP_DIR"

      # CHANGED: skipped on PRs (no OIDC token there) and never fails the build
      - name: Debug OIDC claims
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'EOF'
          import sys,base64,json
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print({k:c[k] for k in ('sub','aud','repository','ref')})
          EOF

      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ENABLED == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # NEW: create the ECR repo if it doesn't exist in this account (avoids "repository does not exist")
      - name: Ensure ECR repository exists
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ENABLED == 'true'
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true

            - name: Tag and push to ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ENABLED == 'true'
        id: push
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Image ${GITHUB_SHA} already in ECR, skipping push"
          else
            docker tag "$ECR_REPOSITORY:${GITHUB_SHA}" "$REPO:${GITHUB_SHA}"
            docker push "$REPO:${GITHUB_SHA}"
          fi
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # CHANGED: uses the env var instead of a hardcoded name
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$VALUES_FILE" \
            --set flask.image.repository="${{ needs.build.outputs.repository }}" \
            --set flask.image.tag="${GITHUB_SHA}" \
            --set postgres.dbPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --atomic --wait --timeout 5m

      - name: Verify
        run: kubectl get pods,svc,ingress -n "$NAMESPACE"
