<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="cabinet">

  <header class="cabinet-header">
    <p class="eyebrow">RECORDS ROOM &mdash; DRAWER 01</p>
    <h1>The Directory</h1>
    <p class="subtitle">Five slots. Every card, filed by hand.</p>
  </header>

  <div class="slot-count" id="slotCount">0 / 5 cards filed</div>

  <main class="card-rail" id="cardRail">
    <!-- cards injected here -->
  </main>

  <p class="hint">Tap a card to read it. Tap an empty slot to file someone new.</p>
</div>

<!-- Add person modal -->
<div class="overlay" id="overlay">
  <div class="ticket">
    <button class="ticket-close" id="closeModal" aria-label="Close">&times;</button>
    <p class="eyebrow">NEW ENTRY</p>
    <h2>File a new card</h2>

    <form id="addForm">
      <label for="fieldName">Name</label>
      <input type="text" id="fieldName" maxlength="100" placeholder="e.g. Rayyan Mudassar" required>

      <label for="fieldAge">Age</label>
      <input type="number" id="fieldAge" min="1" max="130" placeholder="e.g. 20" required>

      <label for="fieldArea">Area</label>
      <input type="text" id="fieldArea" maxlength="100" placeholder="e.g. Shahdara, Lahore" required>

      <p class="form-error" id="formError"></p>

      <button type="submit" class="stamp-btn">Stamp &amp; File</button>
    </form>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
