apiVersion: v1
kind: ConfigMap
metadata:
  name: people-directory-alerts
  namespace: monitoring
  labels:
    grafana_alert: "1"   # matches the sidecar's label selector in your Helm values
data:
  people-directory-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: people-directory
        folder: people-directory
        interval: 1m
        rules:
          - uid: pd-high-error-rate
            title: High 5xx error rate
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus
                model:
                  expr: sum(rate(flask_http_request_total{status=~"5.."}[5m])) / sum(rate(flask_http_request_total[5m]))
              - refId: C
                type: threshold
                conditions:
                  - evaluator: { type: gt, params: [0.05] }
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "5xx error rate above 5% for 5m"

          - uid: pd-pod-down
            title: Flask pod down
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus
                model:
                  expr: up{job="flask-service"} == 0
              - refId: C
                type: threshold
                conditions:
                  - evaluator: { type: gt, params: [0] }
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "flask-service target down for 2m"

          - uid: pd-high-latency
            title: High p95 latency
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus
                model:
                  expr: histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le))
              - refId: C
                type: threshold
                conditions:
                  - evaluator: { type: gt, params: [1] }
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "p95 latency above 1s for 5m"

          - uid: pd-pod-restarts
            title: Pod restarting repeatedly
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus
                model:
                  expr: increase(kube_pod_container_status_restarts_total{namespace="default"}[15m])
              - refId: C
                type: threshold
                conditions:
                  - evaluator: { type: gt, params: [2] }
            for: 0m
            labels: { severity: warning }
            annotations:
              summary: "Container restarted more than twice in 15m"
