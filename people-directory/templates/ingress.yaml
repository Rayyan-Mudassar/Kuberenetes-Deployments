apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: people-directory-ingress
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-service
                port:
                  number: {{ .Values.flask.port }}
      {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
